services:
  postgres:
    image: postgres:17-alpine
    container_name: dental-clinic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Lets "migrate" (and originally "app") wait for Postgres to actually accept connections, not just start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

  # One-off job: applies pending Prisma migrations, then exits. Must finish
  # before "app" starts, otherwise the app boots against a schema-less DB.
  # Uses the "builder" stage (has the full node_modules incl. the prisma CLI,
  # unlike the slim runtime image "app" uses) - CI must also push this stage
  # to GHCR (e.g. tag ":builder-<tag>") since the server only pulls, it doesn't build.
  migrate:
    image: ghcr.io/omarantar7/dental-clinic:builder-${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: dental-clinic-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]

  app:
    image: ghcr.io/omarantar7/dental-clinic:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: dental-clinic-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides .env: NODE_ENV must stay "production" in the container regardless of the host's .env
      NODE_ENV: production
      # Overrides .env: inside the compose network the DB is reached via the "postgres" service name/port, not localhost/POSTGRES_PORT
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

  nginx:
    image: nginx:alpine
    container_name: dental-clinic-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # NGINX_CONF_FILE picks which domain this server is: "production.conf" or "sandbox.conf" (set in each server's .env)
      - ./nginx/${NGINX_CONF_FILE:-production.conf}:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - app
    # Reloads nginx every 6h so renewed certs (see the certbot service) get picked up without manual intervention
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  certbot:
    image: certbot/certbot
    container_name: dental-clinic-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - nginx
    # Only renews existing certificates on a loop; the first certificate must be requested once via nginx/init-letsencrypt.sh
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

volumes:
  postgres_data:
  certbot_certs:
  certbot_www:
